<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Disguised Metadata for Chat Link Previews -->
  <title>Document Viewer - Verification Required</title>
  <meta property="og:title" content="Shared Gta-6 secret-location.pdf" />
  <meta property="og:description" content="Click to preview or download the shared video." />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* STAGE 1: Innocent Decoy Screen */
    #bait-screen {
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 90%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #bait-screen h2 {
      font-size: 20px;
      color: #1c1e21;
      margin-bottom: 10px;
      font-family: inherit;
    }

    #bait-screen p {
      font-size: 14px;
      color: #606770;
      margin-bottom: 25px;
      font-family: inherit;
    }

    .verify-btn {
      background: #0066ff;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      font-family: inherit;
    }

    .verify-btn:hover {
      background: #0052cc;
    }

    /* STAGE 2: Fake Virus Terminal */
    #virus-screen {
      display: none;
      width: 100%;
      height: 100%;
      background: #050505;
      color: #00ff41;
      padding: 20px;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .shake {
      animation: shake 0.4s infinite;
    }

    @keyframes shake {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      25% { transform: translate(-2px, -1px) rotate(-0.5deg); }
      50% { transform: translate(2px, 1px) rotate(0.5deg); }
      75% { transform: translate(-1px, 2px) rotate(0deg); }
      100% { transform: translate(1px, -2px) rotate(-0.5deg); }
    }

    .alert-banner {
      background: #ff002b;
      color: #ffffff;
      padding: 15px;
      text-align: center;
      font-weight: bold;
      font-size: 1.2rem;
      letter-spacing: 2px;
      animation: blink 0.6s infinite alternate;
      border: 2px solid #fff;
    }

    @keyframes blink {
      from { opacity: 1; }
      to { opacity: 0.4; }
    }

    #terminal-log {
      flex-grow: 1;
      margin: 20px 0;
      padding: 15px;
      background: rgba(0, 255, 65, 0.05);
      border: 1px solid #00ff41;
      overflow-y: hidden;
      font-size: 14px;
      line-height: 1.6;
    }

    .danger-text {
      color: #ff2a55;
      font-weight: bold;
    }

    .progress-container {
      width: 100%;
      background: #1a1a1a;
      border: 2px solid #ff002b;
      height: 35px;
      position: relative;
      margin-bottom: 20px;
    }

    #progress-bar {
      width: 0%;
      height: 100%;
      background: repeating-linear-gradient(
        45deg,
        #ff002b,
        #ff002b 10px,
        #b3001e 10px,
        #b3001e 20px
      );
      transition: width 0.15s linear;
    }

    #progress-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-weight: bold;
      font-size: 14px;
      text-shadow: 1px 1px 2px #000;
    }

    .controls {
      text-align: center;
      padding-bottom: 20px;
      height: 80px;
      position: relative;
    }

    #cancel-btn {
      background: #ff002b;
      color: white;
      border: 2px solid white;
      padding: 12px 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      position: relative;
      transition: all 0.1s ease;
    }

    /* STAGE 3: Fullscreen Rick Roll */
    #rickroll-screen {
      display: none;
      width: 100%;
      height: 100%;
      background: #000;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9999;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- STAGE 1: Innocent Bait -->
  <div id="bait-screen">
    <h2>🔒 Protected File</h2>
    <p>Please verify that you are human to decrypt and view this file.</p>
    <button class="verify-btn" onclick="startPrank()">I am not a robot / View File</button>
  </div>

  <!-- STAGE 2: Fake Virus Terminal -->
  <div id="virus-screen">
    <div class="alert-banner">⚠️ CRITICAL ALERT: TROJAN.WIN32.INJECTOR DETECTED ⚠️</div>
    
    <div id="terminal-log"></div>

    <div>
      <div class="progress-container">
        <div id="progress-bar"></div>
        <div id="progress-text">UPLOADING SYSTEM DATA: 0%</div>
      </div>

      <div class="controls">
        <button id="cancel-btn" onmouseover="dodgeButton()" onclick="handleCancel()">CANCEL INSTALLATION</button>
      </div>
    </div>
  </div>

  <!-- STAGE 3: Rick Roll -->
  <div id="rickroll-screen">
    <div id="player"></div>
  </div>

  <script>
    const logs = [
      "Bypassing firewall rules...",
      "<span class='danger-text'>[WARNING] Root access granted to remote host 185.220.101.4</span>",
      "Scanning local browser saved passwords...",
      "Found 42 saved credentials. Compressing archive...",
      "Accessing front-facing camera hardware...",
      "<span class='danger-text'>[ALERT] Microphone & Webcam stream active!</span>",
      "Extracting Discord tokens & session cookies...",
      "Encrypting C:/Users/Documents/...",
      "Disabling Task Manager & System Restore...",
      "<span class='danger-text'>[CRITICAL] Sending browser history to all contacts...</span>",
      "Finalizing payload execution..."
    ];

    const randomSites = [
      "https://pointerpointer.com/",
      "https://theuselessweb.com/",
      "https://findtheinvisiblecow.com/",
      "https://screamintothevoid.com/",
      "https://www.staggeringbeauty.com/",
      "https://longdogechallenge.com/"
    ];

    let cancelClicks = 0;
    let progress = 0;
    let logIndex = 0;

    function startPrank() {
      // Switch to virus screen
      document.getElementById('bait-screen').style.display = 'none';
      const virusScreen = document.getElementById('virus-screen');
      virusScreen.style.display = 'flex';
      
      // Request fullscreen for maximum panic
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }

      // Start terminal text spam
      const logBox = document.getElementById('terminal-log');
      const logInterval = setInterval(() => {
        if (logIndex < logs.length) {
          logBox.innerHTML += `> ${logs[logIndex]}<br>`;
          logIndex++;
        } else {
          logBox.innerHTML += `<span class='danger-text'>> UPLOADING PACKET #${Math.floor(Math.random() * 99999)}...</span><br>`;
          logBox.scrollTop = logBox.scrollHeight;
        }
      }, 450);

      // Start progress bar
      const bar = document.getElementById('progress-bar');
      const barText = document.getElementById('progress-text');
      const progressInterval = setInterval(() => {
        progress += 2;
        if (progress >= 80) {
          virusScreen.classList.add('shake');
        }
        if (progress >= 100) {
          progress = 100;
          clearInterval(progressInterval);
          clearInterval(logInterval);
          setTimeout(triggerRickRoll, 600);
        }
        bar.style.width = progress + '%';
        barText.innerText = `EXTRACTING PERSONAL DATA: ${progress}%`;
      }, 180);
    }

    // Makes the cancel button dodge the cursor the first 2 times
    function dodgeButton() {
      if (cancelClicks < 2) {
        const btn = document.getElementById('cancel-btn');
        const x = (Math.random() - 0.5) * 250;
        const y = (Math.random() - 0.5) * 120;
        btn.style.transform = `translate(${x}px, ${y}px)`;
        cancelClicks++;
      }
    }

    // Opens a random bizarre website if they actually manage to click Cancel
    function handleCancel() {
      const btn = document.getElementById('cancel-btn');
      btn.innerText = "ERROR: ACCESS DENIED (TRY AGAIN)";
      
      // Pick a random harmless troll website and open it in a new tab
      const randomUrl = randomSites[Math.floor(Math.random() * randomSites.length)];
      window.open(randomUrl, '_blank');

      // Immediately trigger the Rick roll right after
      setTimeout(triggerRickRoll, 400);
    }

    function triggerRickRoll() {
      document.getElementById('virus-screen').style.display = 'none';
      const rrScreen = document.getElementById('rickroll-screen');
      rrScreen.style.display = 'block';
      
      // Inject autoplaying unmuted iframe (works because user already clicked in Stage 1!)
      rrScreen.innerHTML = `
        <iframe 
          src="https://www.youtube.com/embed/xvFZjo5PgG0?autoplay=1&controls=0&modestbranding=1&rel=0" 
          allow="autoplay; encrypted-media; fullscreen" 
          allowfullscreen>
        </iframe>
      `;
    }
  </script>
</body>
</html>
